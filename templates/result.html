<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemstone Price Prediction - Result</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .result-container {
            background: rgba(255, 255, 255, 0.08);
            padding: 40px;
            border-radius: 15px;
            width: 450px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeIn 1.2s ease-in-out;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 2rem;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .prediction-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            box-shadow: 0 5px 20px rgba(229, 46, 113, 0.6);
            margin: 20px 0;
        }

        p {
            color: #ccc;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            color: #fff;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(229, 46, 113, 0.6);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="result-container">
        <h2>🔮 Prediction Result</h2>
        <p>The estimated gemstone price is:</p>

        <!-- Flask/Jinja placeholder for the prediction -->
        <div class="prediction-value">
            {{ final_result }} USD
        </div>

        <a href="/predict" class="btn">🔙 Predict Another</a>
    </div>
</body>

</html>
