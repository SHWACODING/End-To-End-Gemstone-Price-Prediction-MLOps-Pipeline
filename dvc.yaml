stages:
  training:
    cmd: python src\GemstonePricePred\pipeline\phase_01_training_pipeline.py
    
    deps:
      - src\GemstonePricePred\pipeline\phase_01_training_pipeline.py
      - src\GemstonePricePred\components\stage_01_data_ingestion.py
      - src\GemstonePricePred\components\stage_02_data_transformation.py
      - src\GemstonePricePred\components\stage_03_model_trainer.py
      - src\GemstonePricePred\components\stage_04_model_evaluation.py
    
    outs:
      - artifacts\raw.csv
      - artifacts\train.csv
      - artifacts\test.csv
      - artifacts\preprocessor.pkl
      - artifacts\model.pkl
